name: CI
on:
  push: { branches: [main, master] }
  pull_request: { branches: [main, master] }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: Lint
        run: go tool golangci-lint run ./...
      - name: Build
        run: make build
      - name: Format check
        run: |
          set -euo pipefail
          files="$(gofmt -l -s .)"
          if [ -n "$files" ]; then
            echo "These files are not gofmt'ed:"
            echo "$files"
            echo
            echo "Run: gofmt -s -w ."
            exit 1
          fi
      - name: Unit tests
        run: make test
      - name: Docker build
        run: docker build -t mcu-agent:ci .
